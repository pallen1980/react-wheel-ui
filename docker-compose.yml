services:
  web:
    build: 
      context: .
      args:
        - FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - FIREBASE_DATABASE_URL=${VITE_FIREBASE_DATABASE_URL}
        - FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID} # Optional
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "51235:80" # Map host port 51235 to container port 80
    container_name: the-wheel
    depends_on:
      - mock-api
    networks:
      - app-network

  mock-api:
    build:
      context: ./mocks/mock-api-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001" # Map host port 3001 to container port 3001
    container_name: mock-api-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:3001
      - ASPNETCORE_HTTP_PORTS=3001
      - FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-myauth-1569840907611}
      - CORS_ORIGINS=http://localhost:51235,http://localhost:51235,http://localhost:3000,http://localhost:3002,http://mock-user-ui:3002
      - USER_MANAGEMENT_ENABLED=true
      - TEST_USER_PREFIX=test_
      - MAX_TEST_USERS=100
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mock-user-ui:
    build:
      context: ./mocks/mock-user-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3001  # Browser access URL
        - VITE_MAIN_APP_URL=http://localhost:51235
        - VITE_APP_TITLE=User Management
    ports:
      - "3002:3002" # Map host port 3002 to container port 3002
    container_name: mock-user-ui
    environment:
      - VITE_API_BASE_URL=http://localhost:3001  # External access for browser
      - VITE_MAIN_APP_URL=http://localhost:51235
      - VITE_APP_TITLE=User Management
      - NODE_ENV=production
    depends_on:
      - mock-api
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    #volumes: # Optional: Mount a volume for development to reflect code changes immediately
    #  - ./src:/app/src
    #  - ./public:/app/public

# Define a network for service communication
networks:
  app-network:
    driver: bridge