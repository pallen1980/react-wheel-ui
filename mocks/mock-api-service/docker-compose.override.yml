version: '3.8'

services:
  mock-api:
    environment:
      # Development-specific environment variables
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      
      # Enable detailed error pages in development
      - ASPNETCORE_DETAILEDERRORS=true
      
      # Development CORS - more permissive
      - CORS_ORIGINS=http://localhost:51235,http://localhost:3000,http://localhost:51235,http://localhost:8080
      
    volumes:
      # Mount source code for hot reload during development (if using dotnet watch)
      # - .:/app/src:ro
      
      # Mount appsettings for easy configuration changes
      - ./appsettings.Development.json:/app/appsettings.Development.json:ro
      
    # Override healthcheck for faster feedback in development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
      
    # Enable debug port for remote debugging (optional)
    # ports:
    #   - "3001:3001"
    #   - "5000:5000"  # Debug port