version: '3.8'

services:
  mock-api:
    environment:
      # Production environment configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft.AspNetCore=Error
      
      # Security settings for production
      - ASPNETCORE_DETAILEDERRORS=false
      
      # Production CORS - more restrictive
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-production-domain.com}
      
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
          
    # Production restart policy
    restart: always
    
    # Production healthcheck - less frequent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    # Production logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"